name: Update README date

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update date and weeks
        run: |
          python - <<'PY'
          from datetime import date
          import re

          today = date.today()
          start = date(2025, 1, 6)

          weeks = (today - start).days // 7
          date_string = today.strftime("%d. %B %Y")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r"<!-- DATE_START -->.*?<!-- DATE_END -->",
              f"<!-- DATE_START -->{date_string}<!-- DATE_END -->",
              content
          )

          content = re.sub(
              r"<!-- WEEKS_START -->.*?<!-- WEEKS_END -->",
              f"<!-- WEEKS_START -->{weeks}<!-- WEEKS_END -->",
              content
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update README date"
          git pull --rebase origin main
          git push origin main
